<!doctype html>
    <html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/curiosity-planet-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>curiosity</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('curiosity.theme')
        if (t !== 'dark' && t !== 'light') {
          t = matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
